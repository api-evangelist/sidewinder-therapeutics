name: Sidewinder Therapeutics
description: Sidewinder Therapeutics is a clinical-stage biopharmaceutical company founded in 2023 and
  headquartered in San Diego, developing a new generation of precision bispecific antibody-drug conjugates
  (ADCs) for the treatment of solid tumors. Its engineered biologics bind two complexed targets simultaneously
  to increase tumor specificity, driving internalization of the antibody-receptor complex and its cytotoxic
  payload, with the goal of expanding the therapeutic window for hard-to-treat cancers such as colorectal,
  lung, and head-and-neck squamous cell carcinomas. The company raised an oversubscribed $137M Series B in
  2026 (co-led by Frazier Life Sciences and Novartis Venture Fund, with DCVC Bio, OrbiMed, and others) and
  is advancing its bispecific ADC programs toward clinical development. Sidewinder is a biopharma research
  company and publishes no public developer or API surface.
